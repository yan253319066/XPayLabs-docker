server {
    listen 443 ssl http2;
    server_name merchant.xpaylabs.com pay.xpaylabs.com;

    ssl_certificate /etc/nginx/certs/merchant.crt;
    ssl_certificate_key /etc/nginx/certs/merchant.key;

    # checkout static files & payment page
    location /checkout {
        proxy_pass http://checkout:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API to user service (used by checkout and merchant-vue)
    location /api/ {
        proxy_pass http://xpay-user:8077/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # merchant backend API
    location /prod-api/ {
        proxy_pass http://xpay-merchant:8078/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # default → merchant-vue
    location / {
        proxy_pass http://merchant-vue:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name merchant.xpaylabs.com pay.xpaylabs.com;
    return 301 https://$host$request_uri;
}
