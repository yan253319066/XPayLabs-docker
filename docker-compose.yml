x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: prod
  db_url: "jdbc:mysql://mysql:3306/xpaylabs?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true"
  db_username: ${DB_USERNAME}
  db_password: ${DB_PASSWORD}
  redis_host: redis
  redis_port: "6379"
  redis_password: ${REDIS_PASSWORD}
  XPAYLABS_SKIP_SIGN_SECRET: ${SKIP_SIGN_SECRET}
  XPAY_PAY_DOMAIN: ${XPAY_PAY_DOMAIN}
  XPAY_API_DOMAIN: ${XPAY_API_DOMAIN}

services:
  mysql:
    image: mysql:8.0
    container_name: xpay-mysql
    environment:
      MYSQL_DATABASE: xpaylabs
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${HOST_PORT_MYSQL}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - xpay-network

  redis:
    image: redis:7-alpine
    container_name: xpay-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${HOST_PORT_REDIS}:6379"
    volumes:
      - redis-data:/data
    networks:
      - xpay-network

  sui-node-service:
    image: xpaylabs/sui-node-service
    pull_policy: never
    container_name: xpay-sui-node
    environment:
      PORT: "3001"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
    command: sh -c "node src/index.js 2>&1 | tee /app/logs/sui-node-service/sys-console.log"
    volumes:
      - ./logs:/app/logs
    ports:
      - "${HOST_PORT_SUI_NODE}:3001"
    networks:
      - xpay-network

  xpay-tron:
    image: xpaylabs/xpay-java
    pull_policy: never
    container_name: xpay-tron
    command: java -jar XPayLabs-tron.jar
    environment:
      <<: *common-env
      # Active TRON chains (comma-separated, see .env TRON_NETWORKS)
      TRON_NETWORKS: ${TRON_NETWORKS}
      TRON_TX_FEE: ${TRON_TX_FEE}
      TRON_ENERGY_APIKEY: ${TRON_ENERGY_APIKEY}
      NODE_TRON: ${NODE_TRON}
      SOLIDITY_TRON: ${SOLIDITY_TRON}
      HEXKEY_TRON: ${HEXKEY_TRON}
      APIKEY_TRON: ${APIKEY_TRON}
      NODE_TRON_TEST: ${NODE_TRON_TEST}
      SOLIDITY_TRON_TEST: ${SOLIDITY_TRON_TEST}
      HEXKEY_TRON_TEST: ${HEXKEY_TRON_TEST}
      APIKEY_TRON_TEST: ${APIKEY_TRON_TEST}
    volumes:
      - ./logs:/app/logs
    ports:
      - "${HOST_PORT_XPAY_TRON}:8075"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - xpay-network

  xpay-sui:
    image: xpaylabs/xpay-java
    pull_policy: never
    container_name: xpay-sui
    command: java -jar XPayLabs-sui.jar
    environment:
      <<: *common-env
      sui_service_url: "http://sui-node-service:3001"
      encryption_key: ${ENCRYPTION_KEY}
    volumes:
      - ./logs:/app/logs
    ports:
      - "${HOST_PORT_XPAY_SUI}:8074"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      sui-node-service:
        condition: service_started
    networks:
      - xpay-network

  xpay-eth:
    image: xpaylabs/xpay-java
    pull_policy: never
    container_name: xpay-eth
    command: java -jar XPayLabs-eth.jar
    environment:
      <<: *common-env
      # Active EVM chains (comma-separated, see .env ETH_NETWORKS)
      ETH_NETWORKS: ${ETH_NETWORKS}
      RPC_ETH: ${RPC_ETH}
      SCAN_ETH: ${SCAN_ETH}
      RPC_ETH_SEPOLIA: ${RPC_ETH_SEPOLIA}
      SCAN_ETH_SEPOLIA: ${SCAN_ETH_SEPOLIA}
      RPC_BSC: ${RPC_BSC}
      SCAN_BSC: ${SCAN_BSC}
      RPC_BSC_TEST: ${RPC_BSC_TEST}
      SCAN_BSC_TEST: ${SCAN_BSC_TEST}
      RPC_POLYGON: ${RPC_POLYGON}
      SCAN_POLYGON: ${SCAN_POLYGON}
      RPC_POLYGON_AMOY: ${RPC_POLYGON_AMOY}
      SCAN_POLYGON_AMOY: ${SCAN_POLYGON_AMOY}
      RPC_AVAX_C_CHAIN: ${RPC_AVAX_C_CHAIN}
      SCAN_AVAX_C_CHAIN: ${SCAN_AVAX_C_CHAIN}
      RPC_AVAX_FUJI_TEST: ${RPC_AVAX_FUJI_TEST}
      SCAN_AVAX_FUJI_TEST: ${SCAN_AVAX_FUJI_TEST}
    volumes:
      - ./logs:/app/logs
    ports:
      - "${HOST_PORT_XPAY_ETH}:8076"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - xpay-network

  xpay-user:
    image: xpaylabs/xpay-java
    pull_policy: never
    container_name: xpay-user
    command: java -jar XPayLabs.jar
    environment:
      <<: *common-env
    volumes:
      - ./logs:/app/logs
    ports:
      - "${HOST_PORT_XPAY_USER}:8077"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      xpay-tron:
        condition: service_started
      xpay-eth:
        condition: service_started
    networks:
      - xpay-network

  xpay-merchant:
    image: xpaylabs/xpay-java
    pull_policy: never
    container_name: xpay-merchant
    command: java -jar XPayLabs-merchant.jar
    environment:
      <<: *common-env
      jwt_secret_key: ${JWT_SECRET_KEY}
    volumes:
      - ./logs:/app/logs
    ports:
      - "${HOST_PORT_XPAY_MERCHANT}:8078"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      xpay-user:
        condition: service_started
    networks:
      - xpay-network

  merchant-vue:
    image: xpaylabs/merchant-vue
    pull_policy: never
    container_name: xpay-merchant-vue
    volumes:
      - ./nginx/merchant-vue.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - xpay-merchant
    networks:
      - xpay-network

  checkout:
    image: xpaylabs/checkout
    pull_policy: never
    container_name: xpay-checkout
    volumes:
      - ./nginx/checkout.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - xpay-user
    networks:
      - xpay-network

  gateway:
    image: nginx:alpine
    container_name: xpay-gateway
    ports:
      - "${HOST_PORT_GATEWAY_HTTP}:80"
      # - "${HOST_PORT_GATEWAY_HTTPS}:443"  # SSL: uncomment + put certs in ./certs/
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
      # - ./nginx/gateway-ssl.conf:/etc/nginx/conf.d/default.conf  # SSL: replace config above
      # - ./certs:/etc/nginx/certs                                   # SSL: uncomment
    depends_on:
      - merchant-vue
      - checkout
    networks:
      - xpay-network

volumes:
  mysql-data:
  redis-data:

networks:
  xpay-network:
    driver: bridge
